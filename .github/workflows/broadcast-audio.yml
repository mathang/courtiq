name: Verify CourtIQ broadcast audio
on:
  push:
    branches: [qa/broadcast-commentary]
permissions:
  contents: read
jobs:
  browser-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Check both announcers, mute and pause on desktop and touch
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/courtiq-vite.log 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/browser/broadcast-audio.mjs
